# =============================================================================
# Docker Compose для деплоя через Dokploy
# =============================================================================
# Этот файл оптимизирован для работы с Dokploy:
# - Traefik labels для автоматического роутинга
# - Environment variables из Dokploy UI
# - Volumes через ../files/ для персистентности
#
# Использование:
# 1. Загрузите этот файл в Dokploy как Docker Compose проект
# 2. Настройте Environment Variables в Dokploy UI
# 3. Настройте домен в Dokploy
# =============================================================================

services:
  # ============================================================================
  # Backend proxy (Traefik → systemd backend на хосте)
  # ============================================================================
  backend-proxy:
    image: alpine:3.19
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - dokploy-network
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-sattva-streamer.top}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.url=http://172.17.0.1:8000"
      - "traefik.http.routers.backend.priority=10"
      # Health check
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"

  # ============================================================================
  # Frontend (Nginx + Vite build)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${FRONTEND_URL:-https://sattva-streamer.top}
        - VITE_API_URL=${FRONTEND_URL:-https://sattva-streamer.top}
        - VITE_TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - VITE_ENABLE_BASIC_LOGIN=${VITE_ENABLE_BASIC_LOGIN:-false}
    
    networks:
      - dokploy-network
    
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-sattva-streamer.top}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Priority - backend API routes have higher priority
      - "traefik.http.routers.frontend.priority=1"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=telegram_db
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      # Используем ../files/ для персистентности в Dokploy
      - ../files/postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ../files/redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

# ============================================================================
# Networks
# ============================================================================
networks:
  # Dokploy создаёт эту сеть автоматически для связи с Traefik
  dokploy-network:
    external: true
  # Внутренняя сеть для связи между сервисами
  internal:
    driver: bridge
    internal: true

  # ============================================================================

# =============================================================================
# Docker Compose для деплоя через Dokploy
# =============================================================================
# Этот файл оптимизирован для работы с Dokploy:
# - Traefik labels для автоматического роутинга
# - Environment variables из Dokploy UI
# - Volumes через ../files/ для персистентности
#
# Использование:
# 1. Загрузите этот файл в Dokploy как Docker Compose проект
# 2. Настройте Environment Variables в Dokploy UI
# 3. Настройте домен в Dokploy
# =============================================================================

services:
  # ============================================================================
  # Backend API (FastAPI)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Database
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/telegram_db
      - REDIS_URL=redis://redis:6379
      
      # JWT (из Dokploy Environment)
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      
      # Telegram
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://sattva-streamer.top/api/auth/google/callback}
      
      # URLs
      - FRONTEND_URL=${FRONTEND_URL:-https://sattva-streamer.top}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://sattva-streamer.top}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://sattva-streamer.top}
      
      # Misc
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TOTP_ISSUER=${TOTP_ISSUER:-TelegramBroadcast}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ../files/backend_data:/app/data
      - ../files/music:/app/music:ro
    
    networks:
      - dokploy-network
      - internal
    
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-sattva-streamer.top}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Health check
      - "traefik.http.services.backend.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.backend.loadbalancer.healthcheck.interval=30s"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ============================================================================
  # Frontend (Nginx + Vite build)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${FRONTEND_URL:-https://sattva-streamer.top}
        - VITE_API_URL=${FRONTEND_URL:-https://sattva-streamer.top}
        - VITE_TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - VITE_ENABLE_BASIC_LOGIN=${VITE_ENABLE_BASIC_LOGIN:-false}
    
    depends_on:
      - backend
    
    networks:
      - dokploy-network
    
    labels:
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-sattva-streamer.top}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Priority - backend API routes have higher priority
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.backend.priority=10"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    
    deploy:
      resources:
        limits:
          memory: 128M

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=telegram_db
    command: ["postgres", "-c", "listen_addresses=*"]
    volumes:
      # Используем ../files/ для персистентности в Dokploy
      - ../files/postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ../files/redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

# ============================================================================
# Networks
# ============================================================================
networks:
  # Dokploy создаёт эту сеть автоматически для связи с Traefik
  dokploy-network:
    external: true
  # Внутренняя сеть для связи между сервисами
  internal:
    driver: bridge
    internal: true

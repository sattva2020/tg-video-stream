name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # allow manual dispatch for branches (useful when running CI for feature branches)
  workflow_dispatch: {}

jobs:
  env-preflight:
    name: Env preflight (sops/age)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('.env.enc') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run preflight-env
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bash scripts/preflight-env.sh

  docs-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install root dependencies
      run: npm install

    - name: Validate docs
      run: npm run docs:validate

  security-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for secrets in code
      run: |
        # Проверка на случайно закоммиченные секреты
        if git log --all --full-history -p | grep -E "(API_KEY|SECRET_KEY|PASSWORD|api_key|secret_key|password)\s*=\s*['\"][^'\"]{8,}['\"]" | grep -v "change_this\|example\|placeholder\|your_"; then
          echo "⚠️ Potential secrets found in git history"
          exit 1
        fi
        echo "✓ No obvious secrets in code"
    
    - name: Validate Docker configuration
      run: |
        # Проверка на Docker socket mount
        if grep -q "docker.sock" docker-compose.yml; then
          echo "❌ Docker socket mount found - security risk!"
          exit 1
        fi
        echo "✓ No Docker socket mount"
        
        # Проверка network isolation
        if grep -q "internal: true" docker-compose.yml; then
          echo "✓ Network isolation configured"
        else
          echo "⚠️ No network isolation found"
        fi
    
    - name: Check for weak password patterns in templates
      run: |
        # Убедиться что template не содержит реальных паролей
        weak_patterns=("admin123" "password123" "123456789" "qwerty")
        for pattern in "${weak_patterns[@]}"; do
          if grep -rq "$pattern" .env.template .env.example backend/.env.example 2>/dev/null; then
            echo "❌ Weak password pattern found: $pattern"
            exit 1
          fi
        done
        echo "✓ No weak password patterns in templates"

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Install pre-commit
      run: |
        pip install pre-commit
    
    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files
    
    - name: Setup test environment
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
        echo "REDIS_HOST=$REDIS_HOST" >> $GITHUB_ENV
        echo "REDIS_PORT=$REDIS_PORT" >> $GITHUB_ENV
        echo "TESTING=true" >> $GITHUB_ENV
    
    - name: Run migrations
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        alembic upgrade head || echo "Migrations skipped"
        
    - name: Run unit tests
      run: |
        pytest -c pytest.ci.ini -m "unit" -v

    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        TESTING: true
      run: |
        pytest -c pytest.ci.ini -m "integration" -v

    - name: Run all tests with coverage
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        TESTING: true
      run: |
        pytest -c pytest.ci.ini --cov=src --cov-report=html --cov-report=xml --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=70 -v

    - name: Generate coverage badge
      if: success()
      run: |
        coverage_percent=$(coverage report | grep TOTAL | awk '{print $4}' | tr -d '%')
        echo "Backend Coverage: ${coverage_percent}%" >> $GITHUB_STEP_SUMMARY

    - name: Generate coverage summary
      if: always()
      run: |
        if [ -f coverage.json ]; then
          echo "## Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat coverage.json | grep -A 5 '"totals"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: |
          backend/htmlcov
          backend/coverage.xml
          backend/.coverage

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml
    
    - name: Install system dependencies (unixODBC)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends unixodbc-dev g++ libpq-dev
        
    - name: Enable Corepack
      run: corepack enable

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Set up Python for pre-commit
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Run pre-commit hooks
      run: pre-commit run --all-files
      
    - name: Lint
      run: pnpm lint
      
    - name: Run unit tests
      run: pnpm test:unit
      
    - name: Run tests with coverage
      run: pnpm test:coverage
      
    - name: Generate coverage badge
      if: success()
      run: |
        # Парсим coverage из вывода vitest
        echo "Frontend tests completed" >> $GITHUB_STEP_SUMMARY
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: |
          frontend/coverage
          frontend/.nyc_output

    - name: Build
      run: pnpm build

    - name: Check build size
      run: |
        size=$(du -sh dist | cut -f1)
        echo "Frontend build size: $size" >> $GITHUB_STEP_SUMMARY

    - name: Validate cross-platform build
      run: |
        bash ../../scripts/ci/validate-build-cross-platform.sh

    - name: Validate bundle chunks
      run: |
        node scripts/validate-chunks.js --threshold 500

  unified-test-report:
    name: Unified Test Report
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: always()

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Enable Corepack
      run: corepack enable

    - name: Install backend dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -q pytest pytest-cov pytest-asyncio pytest-timeout

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: |
        pnpm install --frozen-lockfile --no-optional

    - name: Run unified test runner (CI mode)
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        TESTING: true
      run: |
        bash scripts/run-all-tests.sh backend --ci --verbose || echo "Backend tests completed with status: $?"
      continue-on-error: true

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unified-test-report
        path: |
          test-report.md
          backend/htmlcov
          backend/coverage.json
          frontend/coverage

    - name: Generate combined summary
      if: always()
      run: |
        echo "## 🧪 Unified Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Backend Tests**: $([ -f backend/coverage.json ] && echo '✅ Completed' || echo '❌ Failed')" >> $GITHUB_STEP_SUMMARY
        echo "- **Frontend Tests**: See frontend-test job" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f test-report.md ]; then
          echo "### Detailed Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat test-report.md >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f backend/coverage.json ]; then
          echo "### Backend Coverage Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat backend/coverage.json | jq '.totals' 2>/dev/null || cat backend/coverage.json
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  build-artifact:
    runs-on: ubuntu-latest
    needs: [frontend-test, docs-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend deps
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./frontend
        run: pnpm build

      - name: Build deploy artifact
        run: bash scripts/build_artifact.sh

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-deploy
          path: telegram-deploy-*.tar.gz
          if-no-files-found: error

  frontend-perf:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (odbc + build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc-dev g++ libpq-dev

      - name: Install project dependencies (root)
        run: npm install

      - name: Run perf measurement
        env:
          # skip slow Playwright e2e step in perf job to get stable Lighthouse numbers
          SKIP_PLAYWRIGHT: '1'
          USE_DEV_SERVER: '0'
        run: npm run perf:auth-errors

      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-perf-reports
          path: .internal/frontend-logs/perf/**

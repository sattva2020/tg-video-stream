# Security Scanning Pipeline
# SAST (Static Application Security Testing) + DAST (Dynamic Application Security Testing)
#
# Инструменты:
# - Semgrep: SAST для Python/TypeScript
# - Trivy: Container security + dependency scanning
# - ZAP: DAST для веб-приложений
# - npm audit: JavaScript dependencies
# - pip-audit: Python dependencies
# - CodeQL: GitHub Advanced Security

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Еженедельное сканирование по воскресеньям в 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan including DAST'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================
  # SAST - Static Application Security Testing
  # ========================================
  
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/python \
            --config=p/typescript \
            --config=p/react \
            --config=p/docker \
            --sarif --output=semgrep-results.sarif \
            --error \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='*.min.js' \
            --exclude='coverage*' \
            --exclude='.internal' \
            .

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ========================================
  # Dependency Scanning
  # ========================================
  
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pip-audit
        run: pip install pip-audit

      # Python dependency audit
      - name: Python Dependency Audit
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pip-audit -r backend/requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1

      # JavaScript/TypeScript dependency audit
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: NPM Audit
        working-directory: ./frontend
        run: |
          echo "## NPM Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pnpm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Create audit report
        run: |
          echo "### Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "Check artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # Container Security
  # ========================================
  
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t sattva-backend:scan -f backend/Dockerfile backend/

      - name: Build frontend Docker image
        run: |
          docker build -t sattva-frontend:scan -f frontend/Dockerfile frontend/

      # Scan backend image
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sattva-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Scan frontend image
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sattva-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Scan filesystem for secrets
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload all Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-*.sarif

  # ========================================
  # Secret Scanning
  # ========================================
  
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: |
          gitleaks detect --source=. --report-path=gitleaks-report.json --report-format=json

          # Проверяем результаты
          if [ -f gitleaks-report.json ] && [ "$(cat gitleaks-report.json | jq length)" -gt "0" ]; then
            echo "::error::Potential secrets detected. Review gitleaks-report.json"
            cat gitleaks-report.json | jq '.[0:5]'
            exit 1
          else
            echo "✅ No secrets detected"
          fi

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # ========================================
  # DAST - Dynamic Application Security Testing
  # ========================================
  
  zap-scan:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    # Запускаем только по расписанию или вручную
    if: github.event_name == 'schedule' || github.event.inputs.full_scan == 'true'
    needs: [semgrep, trivy-scan]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      # Build and start application
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_HOST: localhost
          TESTING: true
          SECRET_KEY: test-secret-key-for-zap-scan
        run: |
          python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build and serve frontend
        working-directory: ./frontend
        run: |
          pnpm build
          pnpm preview --port 3000 &
          sleep 5

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 2; done'

      # Run ZAP scan
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l FAIL'

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8000/openapi.json'
          format: openapi
          cmd_options: '-a -j -l FAIL'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: |
            zap-report.html
            zap-report.json

  # ========================================
  # Security Report Summary
  # ========================================
  
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [semgrep, codeql, dependency-audit, trivy-scan, secret-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate summary
        run: |
          echo "# 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Check each job status
          echo "| Semgrep SAST | ${{ needs.semgrep.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container | ${{ needs.trivy-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Detailed reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-combined
          path: security-reports/

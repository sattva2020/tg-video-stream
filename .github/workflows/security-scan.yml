# Security Scanning Pipeline
# SAST (Static Application Security Testing) + DAST (Dynamic Application Security Testing)
#
# Инструменты:
# - Semgrep: SAST для Python/TypeScript
# - Trivy: Container security + dependency scanning
# - ZAP: DAST для веб-приложений
# - npm audit: JavaScript dependencies
# - pip-audit: Python dependencies
# - CodeQL: GitHub Advanced Security

name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Еженедельное сканирование по воскресеньям в 3:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full security scan including DAST'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========================================
  # SAST - Static Application Security Testing
  # ========================================
  
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/python \
            --config=p/typescript \
            --config=p/react \
            --config=p/docker \
            --sarif --output=semgrep-results.sarif \
            --error \
            --exclude='node_modules' \
            --exclude='venv' \
            --exclude='*.min.js' \
            --exclude='coverage*' \
            --exclude='.internal' \
            .

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ========================================
  # Dependency Scanning
  # ========================================
  
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pip-audit
        run: pip install pip-audit

      # Python dependency audit
      - name: Python Dependency Audit
        run: |
          echo "## Python Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pip-audit -r backend/requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY 2>&1

      # JavaScript/TypeScript dependency audit
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: NPM Audit
        working-directory: ./frontend
        run: |
          echo "## NPM Dependency Audit" >> $GITHUB_STEP_SUMMARY
          pnpm audit --audit-level=high >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Create audit report
        run: |
          echo "### Security Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "Check artifacts for detailed reports" >> $GITHUB_STEP_SUMMARY

  # ========================================
  # Container Security
  # ========================================
  
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t sattva-backend:scan -f backend/Dockerfile backend/

      - name: Build frontend Docker image
        run: |
          docker build -t sattva-frontend:scan -f frontend/Dockerfile frontend/

      # Scan backend image
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sattva-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Scan frontend image
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sattva-frontend:scan'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Scan filesystem for secrets
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload all Trivy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-*.sarif

  # ========================================
  # Secret Scanning
  # ========================================
  
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: |
          gitleaks detect --source=. --report-path=gitleaks-report.json --report-format=json

          # Проверяем результаты
          if [ -f gitleaks-report.json ] && [ "$(cat gitleaks-report.json | jq length)" -gt "0" ]; then
            echo "::error::Potential secrets detected. Review gitleaks-report.json"
            cat gitleaks-report.json | jq '.[0:5]'
            exit 1
          else
            echo "✅ No secrets detected"
          fi

      - name: Upload gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # ========================================
  # DAST - Dynamic Application Security Testing
  # ========================================
  
  zap-scan:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    # Запускаем только по расписанию или вручную
    if: github.event_name == 'schedule' || github.event.inputs.full_scan == 'true'
    needs: [semgrep, trivy-scan]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      # Build and start application
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_HOST: localhost
          TESTING: true
          SECRET_KEY: test-secret-key-for-zap-scan
        run: |
          python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build and serve frontend
        working-directory: ./frontend
        run: |
          pnpm build
          pnpm preview --port 3000 &
          sleep 5

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8000/health; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:3000; do sleep 2; done'

      # Run ZAP scan
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j -l FAIL'

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8000/openapi.json'
          format: openapi
          cmd_options: '-a -j -l FAIL'

      - name: Upload ZAP results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-results
          path: |
            zap-report.html
            zap-report.json

  # ========================================
  # Security Report Summary
  # ========================================

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [semgrep, codeql, dependency-audit, trivy-scan, secret-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate summary
        run: |
          echo "# 🔒 Security Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY

          # Check each job status
          echo "| Semgrep SAST | ${{ needs.semgrep.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅ Passed' || '⚠️ Warnings' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container | ${{ needs.trivy-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Detailed reports available in workflow artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Overall status
            const semgrepStatus = '${{ needs.semgrep.result }}';
            const codeqlStatus = '${{ needs.codeql.result }}';
            const depAuditStatus = '${{ needs.dependency-audit.result }}';
            const trivyStatus = '${{ needs.trivy-scan.result }}';
            const secretScanStatus = '${{ needs.secret-scan.result }}';

            // Determine overall security status
            const hasFailures = [semgrepStatus, codeqlStatus, depAuditStatus, trivyStatus, secretScanStatus]
              .some(status => status === 'failure');
            const allPassed = [semgrepStatus, codeqlStatus, depAuditStatus, trivyStatus, secretScanStatus]
              .every(status => status === 'success');

            let emoji = hasFailures ? '🚨' : (allPassed ? '✅' : '⚠️');
            let statusText = hasFailures ? 'Security Issues Found' : (allPassed ? 'All Checks Passed' : 'Warnings Present');

            // Build comment
            let comment = `## ${emoji} Security Scan Results\n\n`;
            comment += `**Overall Status:** ${statusText}\n\n`;

            // Scanner results table
            comment += `### Scanner Results\n\n`;
            comment += `| Scanner | Status | Details |\n`;
            comment += `|---------|--------|----------|\n`;

            comment += `| Semgrep SAST | ${semgrepStatus === 'success' ? '✅ Passed' : '❌ Failed'} | Static code analysis for security vulnerabilities |\n`;
            comment += `| CodeQL | ${codeqlStatus === 'success' ? '✅ Passed' : '❌ Failed'} | Deep semantic analysis for code security |\n`;
            comment += `| Dependency Audit | ${depAuditStatus === 'success' ? '✅ Passed' : '⚠️ Issues'} | Python & npm dependency vulnerabilities |\n`;
            comment += `| Trivy Container | ${trivyStatus === 'success' ? '✅ Passed' : '❌ Failed'} | Container & image security scanning |\n`;
            comment += `| Secret Scan | ${secretScanStatus === 'success' ? '✅ Passed' : '❌ Failed'} | Secrets & credentials detection |\n\n`;

            // Actionable recommendations based on failures
            if (hasFailures) {
              comment += `### 🔧 Recommended Actions\n\n`;

              if (semgrepStatus === 'failure') {
                comment += `#### Semgrep Issues\n`;
                comment += `- **Review the SARIF report** in workflow artifacts for specific findings\n`;
                comment += `- **Common fixes:**\n`;
                comment += `  - Use parameterized queries to prevent SQL injection\n`;
                comment += `  - Validate and sanitize user input\n`;
                comment += `  - Use secure authentication libraries\n`;
                comment += `  - Avoid hardcoded secrets and credentials\n`;
                comment += `- **Action:** Check \`semgrep-results\` artifact for details\n\n`;
              }

              if (codeqlStatus === 'failure') {
                comment += `#### CodeQL Issues\n`;
                comment += `- **Review Security tab** in GitHub for detailed CodeQL alerts\n`;
                comment += `- **Common fixes:**\n`;
                comment += `  - Fix type confusion and null pointer issues\n`;
                comment += `  - Implement proper error handling\n`;
                comment += `  - Use secure coding practices for detected issues\n`;
                comment += `- **Action:** View alerts in the Security tab of this repository\n\n`;
              }

              if (depAuditStatus === 'failure') {
                comment += `#### Dependency Vulnerabilities\n`;
                comment += `- **Update dependencies** to patched versions\n`;
                comment += `- **For Python:**\n`;
                comment += `  - Run \`pip install --upgrade <package>\` in backend\n`;
                comment += `  - Review pinned versions in requirements.txt\n`;
                comment += `- **For JavaScript:**\n`;
                comment += `  - Run \`pnpm update <package>\` in frontend\n`;
                comment += `  - Check if overrides are needed for transitive dependencies\n`;
                comment += `- **Action:** Review audit reports and update vulnerable packages\n\n`;
              }

              if (trivyStatus === 'failure') {
                comment += `#### Container Security Issues\n`;
                comment += `- **Update base images** to latest patched versions\n`;
                comment += `- **Common fixes:**\n`;
                comment += `  - Use specific version tags instead of \`latest\`\n`;
                comment += `  - Run \`docker build --no-cache\` after updates\n`;
                comment += `  - Minimize layers and remove unnecessary packages\n`;
                comment += `- **Action:** Review Dockerfiles and update base images\n\n`;
              }

              if (secretScanStatus === 'failure') {
                comment += `#### 🔴 Secrets Detected\n`;
                comment += `- **CRITICAL:** Remove any committed secrets immediately\n`;
                comment += `- **Immediate actions:**\n`;
                comment += `  - Rotate exposed credentials (API keys, tokens, passwords)\n`;
                comment += `  - Remove secrets from git history using \`git filter-repo\` or BFG\n`;
                comment += `  - Add secrets to .gitignore and use environment variables\n`;
                comment += `  - Consider this commit compromised and rotate ALL exposed credentials\n`;
                comment += `- **Action:** Review \`gitleaks-report\` artifact for locations\n\n`;
              }

              comment += `### 📚 Resources\n\n`;
              comment += `- [OWASP Top 10](https://owasp.org/www-project-top-ten/) - Most critical security risks\n`;
              comment += `- [GitHub Security Documentation](https://docs.github.com/en/code-security)\n`;
              comment += `- [Semgrep Rules](https://semgrep.dev/explore) - Learn about security rules\n\n`;
            } else if (!allPassed) {
              comment += `### ⚠️ Warnings\n\n`;
              comment += `Some scans completed with warnings. Review the detailed reports in workflow artifacts.\n\n`;
            } else {
              comment += `### ✅ All Security Checks Passed\n\n`;
              comment += `No critical security issues detected. Continue to follow security best practices:\n`;
              comment += `- Regularly update dependencies\n`;
              comment += `- Review code changes for security implications\n`;
              comment += `- Keep base Docker images updated\n`;
              comment += `- Use environment variables for secrets\n\n`;
            }

            // Workflow artifacts link
            const runUrl = context.payload.repository.html_url + `/actions/runs/${context.runId}`;
            comment += `### 📋 Detailed Reports\n\n`;
            comment += `View full scan results and artifacts in the [workflow run](${runUrl}).\n\n`;
            comment += `<details>\n`;
            comment += `<summary>Available Artifacts</summary>\n\n`;
            comment += `- \`semgrep-results\` - SARIF format SAST findings\n`;
            comment += `- \`trivy-results\` - Container vulnerability reports\n`;
            comment += `- \`gitleaks-report\` - Secret detection results\n`;
            comment += `- CodeQL results available in Security tab\n`;
            comment += `</details>\n`;

            // Post or update comment
            const commentMarker = '<!-- SECURITY_SCAN_REPORT -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => comment.body.includes(commentMarker));

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment + '\n\n' + commentMarker
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment + '\n\n' + commentMarker
              });
            }

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-combined
          path: security-reports/

  # ========================================
  # Dependency Update Automation
  # ========================================

  dependency-update:
    name: Automatic Dependency Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs: dependency-audit
    # Only run on schedule or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: corepack enable

      - name: Install pip-audit
        run: pip install pip-audit

      # Check for Python vulnerabilities
      - name: Check Python dependencies
        id: python-check
        run: |
          echo "## Checking Python dependencies for vulnerabilities..." >> $GITHUB_STEP_SUMMARY

          # Run pip-audit and capture output
          pip-audit -r backend/requirements.txt --format json > python-vulns.json 2>&1 || true

          # Check if vulnerabilities exist
          if [ -s python-vulns.json ] && [ "$(cat python-vulns.json | jq '. | length')" -gt "0" ]; then
            echo "Vulnerabilities found:" >> $GITHUB_STEP_SUMMARY
            cat python-vulns.json | jq -r '.[] | "\(.name)@\(.installed_version): \(.vulnerabilities | length) vulnerabilities"' >> $GITHUB_STEP_SUMMARY
            echo "has_vulns=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No Python vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      # Check for JavaScript vulnerabilities
      - name: Check JavaScript dependencies
        id: js-check
        run: |
          echo "## Checking JavaScript dependencies for vulnerabilities..." >> $GITHUB_STEP_SUMMARY

          # Install dependencies
          cd frontend && pnpm install --frozen-lockfile

          # Run pnpm audit and save output
          pnpm audit --json > ../js-vulns.json 2>&1 || true
          cd ..

          # Parse vulnerabilities
          if [ -s js-vulns.json ]; then
            vuln_count=$(cat js-vulns.json | jq '.metadata.vulnerabilities.total // 0')
            if [ "$vuln_count" -gt "0" ]; then
              echo "Found $vuln_count vulnerabilities" >> $GITHUB_STEP_SUMMARY
              echo "has_vulns=true" >> $GITHUB_OUTPUT
            else
              echo "✅ No JavaScript vulnerabilities found" >> $GITHUB_STEP_SUMMARY
              echo "has_vulns=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "✅ No JavaScript vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          fi

      # Update Python dependencies
      - name: Update Python dependencies
        if: steps.python-check.outputs.has_vulns == 'true'
        run: |
          echo "Updating Python dependencies..." >> $GITHUB_STEP_SUMMARY

          # Create backup
          cp backend/requirements.txt backend/requirements.txt.bak

          # Upgrade packages with vulnerabilities
          pip-audit -r backend/requirements.txt --fix 2>&1 || true

          # Alternative: Use pip-compile-style updates
          # For each vulnerable package, upgrade to latest safe version
          for pkg in $(cat python-vulns.json | jq -r '.[].name'); do
            echo "Updating $pkg..." >> $GITHUB_STEP_SUMMARY
            pip install --upgrade "$pkg" --target backend/temp_deps 2>&1 || true
          done

          # Update requirements.txt with new versions
          if [ -d backend/temp_deps ]; then
            pip freeze --path backend/temp_deps | grep -v "^\-e" > backend/requirements-new.txt
            mv backend/requirements-new.txt backend/requirements.txt
          fi

      # Update JavaScript dependencies
      - name: Update JavaScript dependencies
        if: steps.js-check.outputs.has_vulns == 'true'
        run: |
          echo "Updating JavaScript dependencies..." >> $GITHUB_STEP_SUMMARY

          cd frontend

          # Update packages with vulnerabilities
          pnpm update --latest 2>&1 || true

          # If update fails, try individual packages
          if [ -s ../js-vulns.json ]; then
            for pkg in $(cat ../js-vulns.json | jq -r '.advisories | keys[]' 2>/dev/null || true); do
              pkg_name=$(cat ../js-vulns.json | jq -r ".advisories[$pkg].module_name")
              echo "Updating $pkg_name..." >> $GITHUB_STEP_SUMMARY
              pnpm update "$pkg_name" --latest 2>&1 || true
            done
          fi

          cd ..

      # Create Pull Request
      - name: Create dependency update PR
        if: steps.python-check.outputs.has_vulns == 'true' || steps.js-check.outputs.has_vulns == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            [Security] Automatic dependency update

            - Update vulnerable Python dependencies
            - Update vulnerable JavaScript/TypeScript dependencies
            - Fixes security vulnerabilities found in automated scan
          title: '[Security] Automatic Dependency Update'
          body: |
            ## 🔒 Security Dependency Update

            This PR automatically updates dependencies to fix security vulnerabilities.

            ### Changes

            - **Python**: Updated vulnerable packages in `backend/requirements.txt`
            - **JavaScript**: Updated vulnerable packages in `frontend/package.json`

            ### Next Steps

            1. Review the updated dependencies
            2. Run the test suite to ensure compatibility
            3. Check the security scan results
            4. Merge if all tests pass

            ### Vulnerability Details

            Check the workflow run for detailed vulnerability reports.

            ---
            🤖 *Automatically created by security scan workflow*
          branch: 'security/dependency-update-${{ github.run_number }}'
          labels: |
            security
            dependencies
          draft: false
          reviewers: |
            ${{ github.actor }}

      - name: Report update status
        if: steps.python-check.outputs.has_vulns == 'true' || steps.js-check.outputs.has_vulns == 'true'
        run: |
          echo "## ✅ Pull Request Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "A pull request has been created with the dependency updates." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the PR" >> $GITHUB_STEP_SUMMARY
          echo "2. Run tests to verify compatibility" >> $GITHUB_STEP_SUMMARY
          echo "3. Merge if everything looks good" >> $GITHUB_STEP_SUMMARY

      - name: No updates needed
        if: steps.python-check.outputs.has_vulns != 'true' && steps.js-check.outputs.has_vulns != 'true'
        run: |
          echo "## ✅ No Updates Needed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All dependencies are secure. No action required." >> $GITHUB_STEP_SUMMARY

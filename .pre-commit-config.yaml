repos:
  - repo: local
    hooks:
      - id: forbid-env
        name: Forbid committing .env
        entry: bash scripts/prevent_commit_env.sh
        language: script
        files: '(^|/).env$'
        stages: [commit]
      - id: i18n-coverage-check
        name: Check i18n coverage
        entry: python scripts/audit_i18n.py
        language: system
        files: '^frontend/src/.*\.(tsx?|ts)$|^frontend/src/i18n\.ts$'
        pass_filenames: false
        always_run: false
      - id: import-linter
        name: Import Linter (Architecture Validation - T051)
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: false
        files: '^backend/src/.*\.py$'
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: ["--line-length=88"]
        language_version: python3.11
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile=black", "--line-length=88"]
        language_version: python3.11
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.0.261
    hooks:
      - id: ruff
        args: ["--fix", "--line-length=88"]

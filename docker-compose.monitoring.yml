version: '3.9'

services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: sattva-prometheus
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: sattva-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/monitoring/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    ports:
      - "3001:3000"
    networks:
      - external
      - internal
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: sattva-alertmanager
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "19093:9093"
    networks:
      - internal
      - monitoring
    environment:
      - ALERTMANAGER_TELEGRAM_BOT_TOKEN=${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}
      - ALERTMANAGER_TELEGRAM_CHAT_ID=${ALERTMANAGER_TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sattva-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    ports:
      - "19100:9100"
    networks:
      - monitoring
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sattva-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${DB_PASSWORD:-sattva_db_pass_2025_9f3c0f}@db:5432/telegram_db?sslmode=disable
    ports:
      - "19187:9187"
    networks:
      - internal
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.3
    container_name: sattva-loki
    volumes:
      - ./config/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Grafana Tempo - Distributed Tracing
  tempo:
    image: grafana/tempo:2.3.1
    container_name: sattva-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/monitoring/tempo-config.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9411:9411"   # Zipkin
      - "14268:14268" # Jaeger HTTP
    networks:
      - monitoring
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # OpenTelemetry Collector - Central telemetry hub
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: sattva-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/monitoring/otel-collector-config.yml:/etc/otel-collector-config.yaml:ro
    ports:
      - "13133:13133" # Health check
      - "8889:8889"   # Prometheus metrics exporter
      - "55679:55679" # zpages
    networks:
      - monitoring
      - internal
      - external
    depends_on:
      - tempo
      - loki
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:13133/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.3
    container_name: sattva-promtail
    volumes:
      - ./config/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - ./backend/logs:/app/backend/logs:ro
      - ./frontend/logs:/app/frontend/logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped

  # Grafana Agent - лёгкая альтернатива Prometheus + Promtail
  # Может заменить prometheus, promtail и otel-collector одним сервисом
  grafana-agent:
    image: grafana/agent:v0.40.0
    container_name: sattva-grafana-agent
    volumes:
      - ./config/monitoring/grafana-agent-config.yml:/etc/agent/agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - ./backend/logs:/app/logs:ro
      - grafana_agent_data:/tmp
    command:
      - "-config.file=/etc/agent/agent.yaml"
      - "-config.expand-env=true"
    ports:
      - "12345:12345"  # HTTP API
      - "4320:4317"    # OTLP gRPC (альтернативный порт)
      - "4321:4318"    # OTLP HTTP (альтернативный порт)
    networks:
      - monitoring
      - internal
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:12345/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Anomaly Detection Service - ML для предсказания проблем
  anomaly-detector:
    build:
      context: ./backend
      dockerfile: Dockerfile.anomaly
    container_name: sattva-anomaly-detector
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ALERTMANAGER_URL=http://alertmanager:9093
      - TELEGRAM_BOT_TOKEN=${ALERTMANAGER_TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${ALERTMANAGER_TELEGRAM_CHAT_ID:-}
      - DETECTION_INTERVAL=60
      - TRAINING_HOURS=24
    volumes:
      - anomaly_models:/app/models
    networks:
      - internal
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ChatOps Bot Enhanced - Telegram бот с расширенными AI возможностями
  # Возможности:
  # - Анализ метрик и логов через AI (7 провайдеров)
  # - RAG поиск по логам (/rag)
  # - Предиктивный анализ с Prophet (/predict)
  # - Генерация Grafana дашбордов (/dashboard)
  # - Автоматические аннотации при аномалиях (/annotate)
  chatops-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.chatops-enhanced
    container_name: sattva-chatops-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${CHATOPS_BOT_TOKEN:-}
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_EXTERNAL_URL=${GRAFANA_EXTERNAL_URL:-https://grafana.sattva-streamer.top}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY:-}
      # AI провайдеры (достаточно одного ключа)
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_USERS=${CHATOPS_ALLOWED_USERS:-}
    volumes:
      - prophet_models:/app/models
    networks:
      - internal
      - external
    depends_on:
      - prometheus
      - loki
      - grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  external:
    driver: bridge
  internal:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_agent_data:
  anomaly_models:
  prophet_models:

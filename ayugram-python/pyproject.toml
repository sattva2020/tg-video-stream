[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayugram-python"
dynamic = ["version"]
description = "Async Python client for AyuGram JSON-RPC API with PyTgCalls-compatible interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Sattva Team", email = "dev@sattva.io"}
]
keywords = ["ayugram", "telegram", "json-rpc", "async", "voice-chat", "streaming", "pytgcalls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.10.5",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
]
redis = [
    "redis>=5.0.1",
]

[project.urls]
Homepage = "https://github.com/sattva-ai/ayugram-python"
Documentation = "https://github.com/sattva-ai/ayugram-python#readme"
Repository = "https://github.com/sattva-ai/ayugram-python"
"Bug Tracker" = "https://github.com/sattva-ai/ayugram-python/issues"

[tool.setuptools.dynamic]
version = {attr = "ayugram.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["ayugram"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "build", "dist", "tests", "examples"]

[tool.ruff.lint]
extend-ignore = ["E203"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    # Ignore deprecation warnings from external dependencies
    "ignore::DeprecationWarning:aiohttp.*",
    "ignore::DeprecationWarning:pyrogram.*",
    "ignore::DeprecationWarning:telethon.*",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = """
    --verbose
    --strict-markers
    --cov=ayugram
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
"""

[tool.coverage.run]
source = ["ayugram"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
    "*/.venv/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
fail_under = 90
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "tests/",
    "examples/",
]

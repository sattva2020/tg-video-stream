[pytest]
# Pytest configuration for ayugram-python SDK

# Test discovery
testpaths = tests
pythonpath = .

# Asyncio configuration
asyncio_mode = auto

# Warning filters
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:aiohttp.*
    ignore::DeprecationWarning:pyrogram.*
    ignore::DeprecationWarning:telethon.*
    ignore:'audioop' is deprecated:DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20

# Output options
addopts =
    --verbose
    --strict-markers
    --cov=ayugram
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml

# Coverage configuration
[coverage:run]
source = ayugram
branch = true
omit =
    */__pycache__/*
    */tests/*
    */.venv/*
    */venv/*
    test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    @abstractmethod
fail_under = 90
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov

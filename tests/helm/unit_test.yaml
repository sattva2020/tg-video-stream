---
suite: Test Backend Service
templates:
  - backend/service.yaml
tests:
  - it: Should render backend Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: RELEASE-NAME-backend
      - equal:
          path: spec.type
          value: ClusterIP

---
suite: Test Backend HPA
templates:
  - backend/hpa.yaml
tests:
  - it: Should render backend HPA when autoscaling enabled
    set:
      backend.autoscaling.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 10

  - it: Should not render HPA when autoscaling disabled
    set:
      backend.autoscaling.enabled: false
    asserts:
      - hasDocuments:
          count: 0

---
suite: Test Ingress
templates:
  - ingress.yaml
tests:
  - it: Should render Ingress when enabled
    set:
      ingress.enabled: true
    asserts:
      - isKind:
          of: Ingress
      - exists:
          path: spec.rules

  - it: Should not render Ingress when disabled
    set:
      ingress.enabled: false
    asserts:
      - hasDocuments:
          count: 0


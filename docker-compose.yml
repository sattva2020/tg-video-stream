services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-sattva_db_pass_2025_9f3c0f}@db:5432/telegram_db
      - REDIS_URL=redis://redis:6379
      # JWT_SECRET and GOOGLE_* variables are loaded from env_file
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./data/music:/app/music:ro
    networks:
      - external
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://sattva-streamer.top}
        - VITE_API_URL=${VITE_API_URL:-https://sattva-streamer.top}
        - VITE_ENABLE_BASIC_LOGIN=${VITE_ENABLE_BASIC_LOGIN:-false}
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME:-}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sattva_db_pass_2025_9f3c0f}
      - POSTGRES_DB=telegram_db
    command: ["postgres", "-c", "listen_addresses=*"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - external
      - internal
      - streamer
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegram Video Streamer
  streamer:
    build: ./streamer
    profiles: ["docker-streamer"]
    env_file:
      - .env
    volumes:
      - ./streamer:/app
      - ./data:/app/data
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - streamer
      - monitoring
      - external
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Rust FFmpeg Transcoder microservice
  rust-transcoder:
    build: ./rust-transcoder
    ports:
      - "18090:8090"
    environment:
      - RUST_LOG=info
      - MAX_CONCURRENT_STREAMS=50
    networks:
      - internal
      - streamer
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # MediaMTX RTMP Ingestion Server
  rtmp-ingest:
    image: aler9/rtsp-simple-server:v1.4.0
    container_name: mediamtx
    command: /config/mediamtx.yml
    ports:
      - "1935:1935"  # RTMP
      - "8888:8888"  # HLS
      - "8554:8554"  # RTSP
      - "8189:8189"  # WebRTC/WHIP
    volumes:
      - ./config/mediamtx/mediamtx.yml:/config/mediamtx.yml:ro
      - ./data/recordings:/recordings
      - mediamtx_hls:/tmp/hls
    networks:
      - streamer
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # WebRTC Signaling Server (TURN/STUN) for guest co-hosting
  webrtc-signaling:
    image: coturn/coturn:4.6.2
    container_name: coturn
    command: ["turnserver", "-c", "/etc/coturn/signaling-server.conf", "-v"]
    ports:
      - "3478:3478"    # TURN/STUN
      - "3478:3478/udp"  # TURN/STUN UDP
      - "5349:5349"    # TURN/TLS
      - "5349:5349/udp"  # TURN/DTLS
      - "49152-65535:49152-65535/udp"  # Relay ports range
    environment:
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:-sattva_turn_secret_change_in_production_2025}
      - TURN_SERVER_NAME=sattva-streamer.top
    volumes:
      - ./config/webrtc/signaling-server.conf:/etc/coturn/signaling-server.conf:ro
    networks:
      - external
      - internal
      - streamer
      - monitoring
    healthcheck:
      test: ["CMD", "turnutils_uclient", "-p", "3478", "127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Monitoring stack
  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - internal
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./config/monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./config/monitoring/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    ports:
      - "3001:3000"
    networks:
      - external
      - internal
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "19094:9093"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Documentation site (MkDocs Material)
  docs:
    build:
      context: ./docs
      target: production
    ports:
      - "8080:8080"
    networks:
      - external
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`docs.${DOMAIN:-sattva.app}`)"
      - "traefik.http.services.docs.loadbalancer.server.port=8080"

networks:
  # Публичная сеть - только для сервисов с внешним доступом (frontend, grafana)
  external:
    driver: bridge
  
  # Приватная сеть backend - изолирована от внешнего мира
  # Содержит: backend, db, redis, prometheus, alertmanager
  internal:
    driver: bridge
    internal: true
  
  # Сеть для стримера - изолирована, только redis доступ
  streamer:
    driver: bridge
    internal: true
  
  # Сеть мониторинга - для связи Prometheus с целями
  monitoring:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  mediamtx_hls:

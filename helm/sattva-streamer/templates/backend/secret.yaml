{{- if and .Values.backend.enabled .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sattva-streamer.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.secretEnv.JWT_SECRET }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.backend.secretEnv.GOOGLE_DRIVE_API_KEY }}
  google-drive-api-key: {{ .Values.secrets.googleDriveApiKey | quote }}
  {{- end }}
  {{- if .Values.backend.secretEnv.API_ID }}
  telegram-api-id: {{ .Values.secrets.telegramApiId | quote }}
  {{- end }}
  {{- if .Values.backend.secretEnv.API_HASH }}
  telegram-api-hash: {{ .Values.secrets.telegramApiHash | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openrouterApiKey }}
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.deepseekApiKey }}
  deepseek-api-key: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.qwenApiKey }}
  qwen-api-key: {{ .Values.secrets.qwenApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.zaiApiKey }}
  zai-api-key: {{ .Values.secrets.zaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
{{- end }}

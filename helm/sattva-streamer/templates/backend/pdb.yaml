{{- if and .Values.podDisruptionBudget.backend.enabled .Capabilities.APIVersions.Has "policy/v1" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sattva-streamer.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sattva-streamer.backend.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.backend.minAvailable }}
  selector:
    matchLabels:
      {{- include "sattva-streamer.backend.selectorLabels" . | nindent 6 }}
{{- end }}

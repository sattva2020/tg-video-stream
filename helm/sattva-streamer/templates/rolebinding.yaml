{{- if and .Values.rbac.create .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sattva-streamer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sattva-streamer.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sattva-streamer.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sattva-streamer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if and .Values.frontend.enabled .Values.frontend.serviceMonitor.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sattva-streamer.frontend.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sattva-streamer.frontend.labels" . | nindent 4 }}
    release: prometheus-operator
  {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "sattva-streamer.frontend.selectorLabels" . | nindent 6 }}
  namespaces:
    - {{ .Release.Namespace }}
  endpoints:
  - port: http
    path: {{ .Values.frontend.serviceMonitor.path | default "/metrics" }}
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
    scheme: http
  {{- with .Values.monitoring.serviceMonitor.relabelings }}
  relabelings:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .Values.monitoring.serviceMonitor.metricRelabelings }}
  metricRelabelings:
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

{{- if .Values.rustTranscoder.enabled }}
{{- $secretName := include "sattva-streamer.rustTranscoder.serviceName" . }}
{{- $hasSecrets := false }}
{{- range $key, $value := .Values.rustTranscoder.secretEnv }}
{{- if $value }}
{{- $hasSecrets = true }}
{{- end }}
{{- end }}
{{- if or .Values.rustTranscoder.secretEnv $hasSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}-secrets
  labels:
    {{- include "sattva-streamer.rustTranscoder.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.rustTranscoder.secretEnv }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}

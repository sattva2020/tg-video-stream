# Coturn TURN/STUN Server Configuration
# This server provides WebRTC signaling and NAT traversal for live streaming guests
# Documentation: https://github.com/coturn/coturn

# Network configuration
# listening-port=3478
# tls-listening-port=5349

# Alternative ports for better NAT traversal
# alt-port=0
# alt-tls-port=0

# External IP configuration - set this to your server's public IP
# or use external-ip=auto to auto-detect
# external-ip=<YOUR_SERVER_PUBLIC_IP>

# Authentication
# Use the REST API mechanism for dynamic credential generation
# The backend will generate time-limited credentials for guests
use-auth-secret
# Static secret key (should be overridden by environment variable in production)
# Generate with: openssl rand -base64 32
static-auth-secret=${TURN_STATIC_AUTH_SECRET:-sattva_turn_secret_change_in_production_2025}

# Realm
realm=sattva-streamer.top

# Log configuration
log-file=stdout
# verbose

# STUN/TURN functionality
# Allow STUN requests (no authentication required for STUN)
stun-only = false

# No-auth mode is disabled - we require authentication
no-stun = false

# User database
# We use the REST API mechanism for dynamic user credentials
# The backend API will generate time-limited TURN credentials
# Format: user=timestamp:turn_credentials_hmac

# TLS/DTLS configuration
# Provide certificates for secure TURN (TURN over TLS)
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/pkey.pem
# CA-file=/etc/coturn/ca.pem

# Enable DTLS and TLS
# dtls-enabled
# tls-enabled

# Cipher suite for TLS/DTLS
# cipher-list="ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384"

# Network configuration
# Listen on IPv4 and IPv6
# listening-ip=0.0.0.0
# listening-ip=::

# Relay configuration
# Allow relay on all IPs
relay-ip=0.0.0.0

# Minimum and maximum relay ports
min-port=49152
max-port=65535

# Timeouts
stale-nonce=600
max-bps=3000000
total-quota=300
user-quota=20

# Mobility (ICE mobility)
mobility=no

# Blacklist problematic IPs
# no-udp
# no-tcp
# no-udp-relay
# no-tcp-relay

# Prometheus metrics endpoint
# Enable metrics for monitoring
# prometheus-metrics-enabled
# prometheus-metrics-ip=0.0.0.0
# prometheus-metrics-port=9641

# Redis integration for distributed state
# Uncomment if using Redis for TURN credential validation
# redis-ip=redis
# redis-port=6379
# redis-statsdb=0
# redis-cache-mseconds=60000

# CLI access
# cli-ip=127.0.0.1
# cli-port=5766
# cli-password=${TURN_CLI_PASSWORD:-turn_cli_password}

# Security
# Secure STUN (requires authentication even for STUN)
secure-stun = false

# Deny specific user agents
# denied-peer-ip=

# Syslog
# syslog-output = false

# Runtime directory
# runtime-dir=/var/run/coturn

# Process permissions
# proc-user=turnserver
# proc-group=turnserver

# Limit number of clients per IP
max-bps-per-user=3000000
total-quota-per-user=100

# Keepalive interval
keep-address-family = false

# No relay for private IPs (optional)
# no-multicast-peers = false

# DSCP marking
# dscp = 46

# Allowed peer IP ranges (for additional security)
# allowed-peer-ip=10.0.0.0/8
# allowed-peer-ip=172.16.0.0/12
# allowed-peer-ip=192.168.0.0/16

# Tempo Configuration - Distributed Tracing
# Документация: https://grafana.com/docs/tempo/latest/configuration/
# 
# Tempo собирает distributed traces от:
# - Backend (FastAPI с OpenTelemetry)
# - Frontend (browser spans)
# - Rust Transcoder

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

# Хранение traces
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

# Настройки приёма трейсов
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250
    zipkin:
      endpoint: 0.0.0.0:9411

# Compactor для оптимизации хранения
compactor:
  compaction:
    block_retention: 168h  # 7 дней
    compacted_block_retention: 1h
    compaction_window: 1h
    max_compaction_objects: 1000000
    
# Query frontend
query_frontend:
  max_retries: 2
  search:
    max_duration: 0s
    
# Ingester settings
ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m
  flush_check_period: 10s
  
# Metrics generation from traces
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: sattva-tv
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    service_graphs:
      dimensions:
        - service
        - http.method
        - http.status_code
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.route
        - http.status_code

# Overrides для ограничения ресурсов
overrides:
  defaults:
    ingestion_rate_limit_bytes: 15000000  # 15MB/s
    ingestion_burst_size_bytes: 20000000  # 20MB
    max_traces_per_user: 10000
    max_bytes_per_trace: 5000000  # 5MB per trace
    max_search_bytes_per_trace: 5000

# Usage report
usage_report:
  reporting_enabled: false

# Alertmanager configuration for 24/7 TV Telegram
# Basic configuration - configure Telegram integration manually when deploying

global:
  resolve_timeout: 5m

# Route tree
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-notifications'
  
  # Route critical alerts immediately
  routes:
    - match:
        severity: critical
      receiver: 'telegram-notifications'
      group_wait: 10s
      repeat_interval: 1h

# Receivers
receivers:
  # Telegram notifications
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: '${ALERTMANAGER_TELEGRAM_BOT_TOKEN}'
        chat_id: ${ALERTMANAGER_TELEGRAM_CHAT_ID}
        api_url: 'https://api.telegram.org'
        parse_mode: 'HTML'
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔥 <b>ALERT FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}
          
          {{ range .Alerts }}
          ━━━━━━━━━━━━━━━━━
          🚨 <b>{{ .Labels.alertname }}</b>
          📊 <b>Severity:</b> {{ .Labels.severity | toUpper }}
          
          📝 <b>Summary:</b>
          {{ .Annotations.summary }}
          
          📋 <b>Description:</b>
          {{ .Annotations.description }}
          
          🏷 <b>Labels:</b>
          {{ range .Labels.SortedPairs }}  • {{ .Name }}: {{ .Value }}
          {{ end }}
          ⏰ <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}
          {{ if .EndsAt }}⏱ <b>Ended:</b> {{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}{{ end }}
          
          🔗 <a href="{{ .GeneratorURL }}">View in Prometheus</a>
          {{ end }}

  # Fallback receiver: does nothing but keeps config valid if env vars missing
  - name: 'null'

# Inhibition rules
# Suppress warning alerts if critical is firing
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Templates (optional)
templates: []

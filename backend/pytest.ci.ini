[pytest]
# Профиль для CI с включённым coverage, retry logic и timeout
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Запускаем все тесты
testpaths = tests

addopts =
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5
    --reruns=3
    --reruns-delay=1
    --timeout=300
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=70
    --cov-branch

# Coverage конфигурация
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    auth: Authentication tests
    api: API endpoint tests

asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Minimum Python version
minversion = 3.11

[pytest]
# Pytest configuration для всех backend тестов

# Environment variables для тестов (через pytest-env plugin)
env =
    SESSION_ENCRYPTION_KEY=TnaLffqg0O5jccqqyQdSKT4JEnf6O2IMalnuECbHv0A=
    JWT_SECRET=test_jwt_secret_key_for_testing_only
    TESTING=true

# Альтернативный способ через setenv (загружается раньше)
setenv =
    SESSION_ENCRYPTION_KEY=TnaLffqg0O5jccqqyQdSKT4JEnf6O2IMalnuECbHv0A=
    JWT_SECRET=test_jwt_secret_key_for_testing_only
    TESTING=true

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths - все тесты в директории tests/
testpaths = tests

# Минимальный уровень логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
# Включаем coverage по умолчанию для отслеживания метрик
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --maxfail=5
    --cov=src
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=json:coverage.json
    --cov-report=lcov:coverage.lcov
    --cov-fail-under=70
    --cov-branch

# Coverage конфигурация
[coverage:run]
source = src
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
skip_empty = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
# Пример: pytest --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=70

# Markers для категоризации тестов
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require DB, Redis, etc.)
    e2e: End-to-end tests
    slow: Slow running tests (> 1s)
    auth: Authentication tests
    api: API endpoint tests
    db: Database tests
    redis: Redis tests
    telegram: Telegram API tests
    audio: Audio processing tests
    stream: Streaming tests
    admin: Admin functionality tests
    notifications: Notification tests

# Asyncio mode
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Minimum Python version
minversion = 3.11

